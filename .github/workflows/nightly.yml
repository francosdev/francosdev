name: Nightly telemetry 📡

# Every night: renders the telemetry panel (live GitHub stats + dot-matrix contribution map)
# with scripts/telemetry.mjs and publishes it to the `output` branch, which the README reads from.
# Also runs on pushes that touch the renderer, and on demand (Actions → Run workflow).

on:
  schedule:
    - cron: "17 3 * * *" # 00:17 in São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/telemetry.mjs"
      - "scripts/glyphs.json"
      - ".github/workflows/nightly.yml"

permissions:
  contents: write

concurrency:
  group: nightly-telemetry
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Keep yesterday's panel as a fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh api "repos/${{ github.repository }}/contents/telemetry.svg?ref=output" \
            -H "Accept: application/vnd.github.raw" > dist/telemetry.tmp 2>/dev/null \
            && [ -s dist/telemetry.tmp ] && mv dist/telemetry.tmp dist/telemetry.svg || rm -f dist/telemetry.tmp

      - name: Render telemetry 📡
        run: node scripts/telemetry.mjs --out dist/telemetry.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        continue-on-error: true

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "📡 nightly telemetry"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
